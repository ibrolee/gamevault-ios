name: Validate GameVault iOS source
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test:backup
      - run: npm run test:config
      - run: npm run test:steam
      - run: npm run check
      - run: npx expo-doctor
